<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="QuizScanner">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232a40"/>
      <stop offset="1" stop-color="#14161f"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f2efe8"/>
    </linearGradient>
  </defs>

  <!-- ciemny kafel -->
  <rect x="24" y="24" width="464" height="464" rx="106" fill="url(#tile)"/>
  <rect x="25" y="25" width="462" height="462" rx="105" fill="none" stroke="#333b50" stroke-width="2"/>

  <!-- narozniki "skanera" (sygnatura) -->
  <g fill="none" stroke="#e2603f" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <path d="M96 140 L96 96 L140 96"/>
    <path d="M372 96 L416 96 L416 140"/>
    <path d="M96 372 L96 416 L140 416"/>
    <path d="M372 416 L416 416 L416 372"/>
  </g>

  <!-- karta odpowiedzi (lekko obrocona) -->
  <g transform="rotate(-6 256 256)">
    <rect x="155" y="160" width="210" height="210" rx="36" fill="#000000" opacity="0.22"/>
    <rect x="151" y="151" width="210" height="210" rx="36" fill="url(#card)"/>
    <!-- ptaszek = poprawna odpowiedz -->
    <path d="M205 232 L243 272 L327 188" fill="none" stroke="#e2603f"
          stroke-width="29" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- kropki A / B / C / D -->
    <circle cx="205" cy="318" r="13" fill="#e8a13c"/>
    <circle cx="239" cy="318" r="13" fill="#2f9fb3"/>
    <circle cx="273" cy="318" r="13" fill="#8a7bef"/>
    <circle cx="307" cy="318" r="13" fill="#4faa6a"/>
  </g>
</svg>
